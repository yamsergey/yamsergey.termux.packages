name: Firefox (Wayland)

# Builds only x11-packages/firefox for aarch64, with the Wayland toolkit enabled in its
# mozconfig.cfg. Same steps as packages.yml uses for big packages (host build, no Docker).

on:
  workflow_dispatch:
  push:
    branches:
    - firefox-wayland
    paths:
    - 'x11-packages/firefox/**'
    - '.github/workflows/firefox-wayland.yml'

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - name: Clone repository
      uses: actions/checkout@v5
    - name: Set up the build environment and free disk space
      run: |
        ./scripts/setup-ubuntu.sh
        unset NDK ANDROID_HOME
        ./scripts/setup-android-sdk.sh
        rm -f ${HOME}/lib/ndk-*.zip ${HOME}/lib/sdk-*.zip
        sudo apt install ninja-build
        ./scripts/free-space.sh
    - name: Build firefox
      run: |
        unset NDK ANDROID_HOME
        ./build-package.sh -I -C -a aarch64 firefox
    - name: Checksums
      if: always()
      run: |
        mkdir -p output
        find output -type f -name "*.deb" -exec sha256sum "{}" \; | sort -k2 | tee output/SHA256SUMS
    - name: Store *.deb files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: firefox-wayland-aarch64-${{ github.sha }}
        path: output/
