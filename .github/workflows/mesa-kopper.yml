name: Mesa (zink via kopper)

# Builds only packages/mesa for aarch64 with 0020-egl-zink-kopper-without-drm.patch
# (yamsergey.linux.android E6). Same steps as packages.yml (zram, package-builder Docker image, free-space).

on:
  workflow_dispatch:
    inputs:
      unstripped:
        description: 'Keep ELF symbols (TERMUX_PKG_NO_STRIP), to symbolicate stacks from the stripped build'
        type: boolean
        default: false
  push:
    branches:
    - mesa-kopper
    paths:
    - 'packages/mesa/**'
    - '.github/workflows/mesa-kopper.yml'

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
    - name: Enable zram
      uses: ./.github/actions/zram
      with:
        algorithm: zstd
        size: 16G
        priority: 100
        device_name: /dev/zram0
    - name: Load Docker image
      run: ./scripts/run-docker.sh true
    - name: Free additional disk space
      run: ./scripts/free-space.sh
    - name: Keep symbols
      if: inputs.unstripped
      # meson install --strip strips on its own, whatever TERMUX_PKG_NO_STRIP says.
      run: |
        sed -i '/^TERMUX_PKG_REVISION=/a TERMUX_PKG_NO_STRIP=true' packages/mesa/build.sh
        sed -i 's/local _meson_stripflag="--strip"/local _meson_stripflag=/' scripts/build/configure/termux_step_configure_meson.sh
    - name: Build mesa
      run: ./scripts/run-docker.sh -d ./build-package.sh -I -C -a aarch64 mesa
    - name: Checksums
      if: always()
      run: |
        mkdir -p output
        test -d termux-packages/output && mv termux-packages/output/* ./output/ || true
        # Dependencies built on the way are not ours to ship, and names like openssl_1:… break the upload.
        find output -type f ! -name 'mesa*.deb' -delete
        find output -type f -name "*.deb" -exec sha256sum "{}" \; | sort -k2 | tee output/SHA256SUMS
    - name: Store *.deb files
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: mesa-kopper-aarch64${{ inputs.unstripped && '-unstripped' || '' }}-${{ github.sha }}
        path: output/
